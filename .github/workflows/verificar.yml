name: Verificar

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Solo los servicios de Supabase que usan las pruebas
      - name: Levantar Supabase local
        run: pnpm exec supabase start -x studio,imgproxy,realtime,storage-api,postgres-meta,edge-runtime,logflare,vector,supavisor

      # Reintenta porque los espejos de Ubuntu a veces fallan
      - name: Instalar Chromium para Playwright
        run: |
          for intento in 1 2 3; do
            pnpm -C apps/web exec playwright install --with-deps chromium && exit 0
            sleep 30
          done
          exit 1

      - name: Verificar
        run: pnpm verificar

      - name: Guardar el reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Apagar Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  publicar:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # La URL y la clave publicable de Supabase son públicas por diseño
      - name: Construir la web
        env:
          BASE_PATH: /the-lab-ai-tracker/
          VITE_SUPABASE_URL: https://glthjfxprnozztuanjlf.supabase.co
          VITE_SUPABASE_CLAVE: sb_publishable_epDm4hk-o0JIVxgpEO4jrg_POPqBp9C
        run: |
          pnpm -C apps/web build
          cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - id: despliegue
        uses: actions/deploy-pages@v4
