name: Verificar

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Solo los servicios de Supabase que usan las pruebas
      - name: Levantar Supabase local
        run: pnpm exec supabase start -x studio,imgproxy,realtime,storage-api,postgres-meta,edge-runtime,logflare,vector,supavisor

      - name: Instalar Chromium para Playwright
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Verificar
        run: pnpm verificar

      - name: Guardar el reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Apagar Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
